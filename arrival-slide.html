<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vonked - Arrival Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; overflow: hidden; user-select: none; }
    .container { position: fixed; top: 24px; left: 24px; }
    .card { background: #000000; border-radius: 28px; padding: 56px 64px; display: inline-flex; flex-direction: column; align-items: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); max-width: 700px; }

    .logo { width: 72px; height: 72px; margin-bottom: 24px; }
    .section-label { font-size: 16px; font-weight: 600; color: #cd9178; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; }
    .title { font-size: 52px; font-weight: 800; color: #ffffff; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1; text-align: center; margin-bottom: 32px; }
    .divider { width: 80px; height: 3px; background: rgba(255,255,255,0.2); margin-bottom: 32px; }

    .instructions { text-align: left; width: 100%; }
    .instruction-item { display: flex; align-items: baseline; margin-bottom: 24px; }
    .instruction-number { font-size: 24px; font-weight: 700; color: #b8633f; margin-right: 16px; min-width: 32px; }
    .instruction-text { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.9); line-height: 1.5; }
    .instruction-detail { font-size: 18px; color: rgba(255,255,255,0.5); font-style: italic; margin-top: 4px; }

    .example-box { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 24px 28px; margin-top: 32px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .example-label { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; }
    .example-text { font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.7); font-family: monospace; white-space: nowrap; text-align: center; }

    /* Badge bar at bottom */
    .badge-bar { display: flex; gap: 14px; margin-top: 40px; }
    .badge { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border: 2px solid rgba(184,99,63,0.4); border-radius: 16px; font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.7); text-transform: lowercase; }
    .badge-icon { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <svg class="logo" viewBox="0 0 136.8102 134.6695" xmlns="http://www.w3.org/2000/svg">
        <path d="M70.6985,40.0101c-19.4478,0-40.2323,.0019-58.0377,.0019l9.8429,17.0509,7.6072-13.0528h10.8717l-14.6672,25.1669c-.369,.6267-.9017,1.1739-1.5764,1.5618-2.0508,1.1782-4.6716,.4717-5.8494-1.5787L.6375,37.5406c-.5532-.8866-.7807-1.9942-.5454-3.1538,.4064-2.0026,2.2732-3.3767,4.3166-3.3767,24.6433,0,49.4041-.0022,73.6195-.0022,.7119,.0022,1.436,.1808,2.0986,.5592,2.0117,1.154,2.7029,3.7254,1.5468,5.737l-35.056,60.7195,13.2063,23.0265L125.0851,8.0101H61.9634l-11.0699,19h-9.6895L55.7146,2.1059C56.494,.7632,57.9007,.0101,59.3487,.0101l73.2234-.0101c2.3418,0,4.2381,1.8979,4.2381,4.2381,0,.9213-.2932,1.7701-.7887,2.4641L63.3624,132.5501c-1.157,2.0241-3.7382,2.7181-5.7586,1.5574-.6732-.3843-1.2017-.9336-1.561-1.5616l-18.1258-31.5791c-.8345-1.462-.7019-3.2178,.1985-4.5191l32.583-56.4375Z" fill="#b8633f" fill-rule="evenodd"/>
      </svg>

      <div class="section-label">■ Arrival Check-In ■</div>
      <div class="title">TYPE IN<br>CHAT</div>

      <div class="divider"></div>

      <div class="instructions">
        <div class="instruction-item">
          <span class="instruction-number">1.</span>
          <div>
            <div class="instruction-text">Stress level today</div>
            <div class="instruction-detail">scale 0–10 (0 = no stress ‖ 10 = max stress)</div>
          </div>
        </div>

        <div class="instruction-item">
          <span class="instruction-number">2.</span>
          <div>
            <div class="instruction-text">1–3 words about where you are right now / arriving from</div>
          </div>
        </div>
      </div>

      <div class="example-box">
        <div class="example-label">Example Response</div>
        <div class="example-text">"7, anxious, sleepy, mentally drained"</div>
      </div>

      <!-- Badge bar at bottom -->
      <div class="badge-bar">
        <div class="badge">
          <svg class="badge-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path d="m192 448c-4.2539 0.023438-8.3398-1.6445-11.359-4.6406l-59.199-59.359h-41.441c-12.73 0-24.938-5.0586-33.941-14.059-9-9.0039-14.059-21.211-14.059-33.941v-224c0-12.73 5.0586-24.938 14.059-33.941 9.0039-9 21.211-14.059 33.941-14.059h352c12.73 0 24.938 5.0586 33.941 14.059 9 9.0039 14.059 21.211 14.059 33.941v222.88c-0.039062 12.824-5.0703 25.129-14.035 34.301-8.9609 9.1719-21.145 14.488-33.965 14.82h-224v48c-0.015625 3.1602-0.96484 6.2422-2.7305 8.8633-1.7656 2.6172-4.2695 4.6562-7.1914 5.8555-1.8984 0.89844-3.9805 1.3359-6.0781 1.2812zm-64-96c4.2344 0.058594 8.293 1.7148 11.359 4.6406l36.641 36.641v-25.281c-0.023438-4.2539 1.6445-8.3398 4.6406-11.359 3.0195-2.9961 7.1055-4.6641 11.359-4.6406h240c4.3438-0.28516 8.4141-2.2148 11.387-5.3945 2.9727-3.1797 4.6211-7.3711 4.6133-11.727v-222.88c0-4.2422-1.6875-8.3125-4.6875-11.312s-7.0703-4.6875-11.312-4.6875h-352c-4.2422 0-8.3125 1.6875-11.312 4.6875s-4.6875 7.0703-4.6875 11.312v224c0 4.2422 1.6875 8.3125 4.6875 11.312s7.0703 4.6875 11.312 4.6875z" fill="#b8633f"/>
            <path d="m192 224c0 17.672-14.328 32-32 32s-32-14.328-32-32 14.328-32 32-32 32 14.328 32 32z" fill="#b8633f"/>
            <path d="m288 224c0 17.672-14.328 32-32 32s-32-14.328-32-32 14.328-32 32-32 32 14.328 32 32z" fill="#b8633f"/>
            <path d="m384 224c0 17.672-14.328 32-32 32s-32-14.328-32-32 14.328-32 32-32 32 14.328 32 32z" fill="#b8633f"/>
          </svg>
          chat
        </div>
      </div>
    </div>
  </div>
</body>
</html>
