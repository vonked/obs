<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vonked - Who Goes First</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; overflow: hidden; user-select: none; }
    .banner { position: fixed; bottom: 0; left: 0; right: 0; background: #000000; padding: 36px 50px; display: flex; align-items: center; justify-content: center; gap: 20px; }
    .icon { font-size: 36px; }
    .label { font-size: 26px; font-weight: 700; color: #b8633f; text-transform: uppercase; letter-spacing: 0.1em; }
    .question { font-size: 30px; font-weight: 500; color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>
  <div class="banner">
    <span class="icon">&#10067;</span>
    <span class="label">Who goes first:</span>
    <span class="question">Who has the most letters in their middle name?</span>
  </div>
</body>
</html>
