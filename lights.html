<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vonked - Lights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; overflow: hidden; user-select: none; }
    .container { position: fixed; top: 24px; left: 24px; }
    .card { background: #000000; border-radius: 28px; padding: 60px 72px; display: inline-flex; flex-direction: column; align-items: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); max-width: 780px; }

    .logo { width: 72px; height: 72px; margin-bottom: 24px; }
    .eyebrow { font-size: 22px; font-weight: 700; color: #b8633f; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 10px; }
    .title { font-size: 52px; font-weight: 800; color: #ffffff; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1; text-align: center; margin-bottom: 24px; }
    .divider { width: 100px; height: 4px; background: #b8633f; margin-bottom: 28px; }

    .share-prompt { font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 36px; font-style: italic; }
    .share-prompt strong { color: rgba(255,255,255,0.8); font-weight: 600; font-style: normal; }

    .lights { width: 100%; }
    .light-item { display: flex; align-items: center; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 22px 28px; margin-bottom: 16px; }
    .light-item:last-child { margin-bottom: 0; }
    .light-icon { font-size: 28px; margin-right: 20px; min-width: 36px; text-align: center; }
    .light-name { font-size: 26px; font-weight: 700; color: #cd9178; text-transform: uppercase; margin-right: 12px; }
    .light-desc { font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.6); font-style: italic; }

    .time-box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 18px 28px; margin-top: 32px; text-align: center; width: 100%; }
    .time-text { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.45); }
    .time-text strong { color: rgba(255,255,255,0.65); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <svg class="logo" viewBox="0 0 136.8102 134.6695" xmlns="http://www.w3.org/2000/svg">
        <path d="M70.6985,40.0101c-19.4478,0-40.2323,.0019-58.0377,.0019l9.8429,17.0509,7.6072-13.0528h10.8717l-14.6672,25.1669c-.369,.6267-.9017,1.1739-1.5764,1.5618-2.0508,1.1782-4.6716,.4717-5.8494-1.5787L.6375,37.5406c-.5532-.8866-.7807-1.9942-.5454-3.1538,.4064-2.0026,2.2732-3.3767,4.3166-3.3767,24.6433,0,49.4041-.0022,73.6195-.0022,.7119,.0022,1.436,.1808,2.0986,.5592,2.0117,1.154,2.7029,3.7254,1.5468,5.737l-35.056,60.7195,13.2063,23.0265L125.0851,8.0101H61.9634l-11.0699,19h-9.6895L55.7146,2.1059C56.494,.7632,57.9007,.0101,59.3487,.0101l73.2234-.0101c2.3418,0,4.2381,1.8979,4.2381,4.2381,0,.9213-.2932,1.7701-.7887,2.4641L63.3624,132.5501c-1.157,2.0241-3.7382,2.7181-5.7586,1.5574-.6732-.3843-1.2017-.9336-1.561-1.5616l-18.1258-31.5791c-.8345-1.462-.7019-3.2178,.1985-4.5191l32.583-56.4375Z" fill="#b8633f" fill-rule="evenodd"/>
      </svg>

      <div class="eyebrow">Breakout</div>
      <div class="title">LIGHTS</div>

      <div class="divider"></div>

      <div class="share-prompt"><strong>SHARE:</strong> in the past week your...</div>

      <div class="lights">
        <div class="light-item">
          <div class="light-icon">&#127744;</div>
          <div class="light-name">Lowlight</div>
          <div class="light-desc">struggle / issue</div>
        </div>

        <div class="light-item">
          <div class="light-icon">&#128262;</div>
          <div class="light-name">Highlight</div>
          <div class="light-desc">best part</div>
        </div>

        <div class="light-item">
          <div class="light-icon">&#128165;</div>
          <div class="light-name">Spark</div>
          <div class="light-desc">sparked your interest</div>
        </div>
      </div>

      <div class="time-box">
        <div class="time-text"><strong>7 min total</strong> &nbsp;|&nbsp; <strong>2 min</strong> shares each</div>
      </div>

    </div>
  </div>
</body>
</html>
